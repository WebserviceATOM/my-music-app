<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSync Pro - High-Res Music Sync</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ea; --secondary: #7000ff; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.9); }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-container { max-width: 1000px; width: 100%; }
        header h1 { text-align: center; font-size: 3rem; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0; letter-spacing: -2px; }
        
        .monitor-bar { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; display: flex; justify-content: space-around; font-size: 0.8rem; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-value { display: block; font-weight: 800; color: var(--primary); font-size: 1.1rem; }

        .input-section { background: var(--card-bg); border-radius: 24px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .url-input-group { display: flex; gap: 12px; margin-bottom: 15px; }
        input, select { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        
        .btn { cursor: pointer; border: none; border-radius: 12px; font-weight: 700; transition: 0.3s; }
        .btn-plus { background: var(--primary); color: #0f172a; width: 50px; font-size: 1.5rem; }
        .btn-scan { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; width: 100%; height: 60px; font-size: 1.2rem; margin-top: 15px; box-shadow: 0 10px 20px rgba(0, 242, 234, 0.2); }
        .btn-scan:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .naming-rule { margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 12px; }
        .song-card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 25px; display: grid; grid-template-columns: 240px 1fr; gap: 25px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .song-card:hover { border-color: var(--primary); }
        
        .thumb-container { width: 240px; height: 135px; border-radius: 16px; overflow: hidden; position: relative; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .thumb-container img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; opacity:0; transition:0.3s; font-size: 2rem; }
        .thumb-container:hover .play-overlay { opacity:1; }
        
        .action-link { background: rgba(0, 242, 234, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 5px 12px; border-radius: 30px; font-size: 0.75rem; cursor: pointer; display: inline-block; margin-bottom: 12px; font-weight: 600; }
        .label-small { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; display: block; font-weight: 600; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        
        .preview-player { display:none; width:100%; height:200px; margin-top:15px; border-radius:16px; border: 1px solid var(--primary); }
        .download-bar { position: sticky; bottom: 30px; width: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); padding: 20px; border-radius: 20px; color: #fff; font-weight: 900; text-align: center; cursor: pointer; box-shadow: 0 20px 40px rgba(0,0,0,0.6); display: none; z-index: 1000; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="monitor-bar">
        <div><span class="stat-value">ULTRA</span>AUDIO</div>
        <div><span class="stat-value">24-bit</span>WAV</div>
        <div><span class="stat-value" id="count-monitor">0</span>SCAN</div>
    </div>

    <header><h1>VibeSync Pro</h1></header>

    <div class="input-section">
        <div id="urlInputs">
            <div class="url-input-group">
                <input type="text" class="url-field" placeholder="YouTube / YT Music URLを貼り付け" style="flex: 1;">
                <button class="btn btn-plus" onclick="addInput()">＋</button>
            </div>
        </div>
        <div class="naming-rule">
            <label class="label-small">📂 保存ファイル名の形式設定</label>
            <input type="text" id="namingTemplate" value="【{title}】{artist}" style="width:100%; font-weight:bold; color:var(--primary);">
            <div style="font-size:0.7rem; color:#64748b; margin-top:8px;">使える変数: {title}, {artist}, {album}, {n}(連番)</div>
        </div>
        <button class="btn btn-scan" onclick="analyzeAll()">YouTubeスキャン & 解析開始</button>
    </div>

    <div id="status" style="text-align:center; color:var(--primary); font-weight:bold; margin-bottom:25px; font-size:1.1rem;"></div>
    <div id="list"></div>
    <div id="downloadBar" class="download-bar" onclick="startBatchDownload()">設定を確定して一括保存を開始</div>
</div>

<script>
    let songQueue = [];

    function addInput() {
        const div = document.createElement('div');
        div.className = 'url-input-group';
        div.innerHTML = `<input type="text" class="url-field" placeholder="URLを追加" style="flex:1;"><button class="btn btn-plus" style="background:var(--secondary);color:white;" onclick="this.parentElement.remove()">✕</button>`;
        document.getElementById('urlInputs').appendChild(div);
    }

    async function analyzeAll() {
        const urls = Array.from(document.querySelectorAll('.url-field')).map(f => f.value).filter(v => v.trim());
        const status = document.getElementById('status');
        status.innerText = "⚡ ANALYZING YOUTUBE...";
        
        const res = await fetch('/analyze', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({urls})
        });
        const data = await res.json();
        
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = ""; songQueue = [];

        data.songs.forEach((song) => {
            const id = Math.random().toString(36).substring(7);
            songQueue.push({id, url: song.url, uploader: song.uploader});
            
            const html = `
                <div class="song-card" id="card-${id}" data-uploader="${song.uploader}">
                    <div>
                        <div class="thumb-container" onclick="togglePlayer('${id}', '${song.id}')">
                            <img src="${song.thumbnail}" id="thumb-${id}"><div class="play-overlay">▶</div>
                        </div>
                        <iframe id="player-${id}" class="preview-player" frameborder="0"></iframe>
                    </div>
                    <div class="song-info">
                        <div class="action-link" onclick="switchToOfficial('${id}')">💿 公式音源(Topic版)を探す</div>
                        <input type="text" id="title-${id}" value="${song.title}" style="width:100%; margin-bottom:12px; font-weight:bold;">
                        <input type="hidden" id="url-${id}" value="${song.url}">
                        <div class="grid-2">
                            <div><label class="label-small">ARTIST</label><input type="text" id="artist-${id}" value="${song.uploader}" style="width:100%;"></div>
                            <div><label class="label-small">ALBUM</label><input type="text" id="album-${id}" value="Loading..." style="width:100%;"></div>
                        </div>
                        <div class="grid-2">
                            <div><label class="label-small">✂️ 開始オフセット(秒)</label><input type="number" id="off-s-${id}" value="0" style="width:100%;"></div>
                            <div><label class="label-small">✂️ 終了オフセット(秒)</label><input type="number" id="off-e-${id}" value="0" style="width:100%;"></div>
                        </div>
                        <div style="display:flex; align-items:center; gap:15px; background:rgba(0,0,0,0.2); padding:10px; border-radius:10px;">
                            <input type="checkbox" id="clean-${id}" checked style="width:20px; height:20px;"> 
                            <label class="label-small" style="margin:0;">AIスマートカット (物語/セリフ等を自動除去)</label>
                            <select id="format-${id}" style="margin-left:auto; padding:5px 10px;"><option value="wav">24bit WAV</option><option value="mp4">MP4 MV</option></select>
                        </div>
                    </div>
                </div>`;
            listDiv.insertAdjacentHTML('beforeend', html);
            fetchExtra(id, song.title, song.uploader);
        });
        document.getElementById('downloadBar').style.display = 'block';
        document.getElementById('count-monitor').innerText = data.songs.length;
        status.innerText = "SCAN COMPLETE";
    }

    async function switchToOfficial(id) {
        const title = document.getElementById(`title-${id}`).value;
        const artist = document.getElementById(`artist-${id}`).value;
        document.getElementById('status').innerText = "音源を検索中...";
        const res = await fetch('/find_official', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title, artist}) });
        const data = await res.json();
        if(data.success) {
            document.getElementById(`url-${id}`).value = data.url;
            document.getElementById(`title-${id}`).value = data.title;
            document.getElementById(`thumb-${id}`).src = `https://i.ytimg.com/vi/${data.id}/hqdefault.jpg`;
            alert("公式音源へ切り替えました。");
        } else { alert("公式音源が見つかりませんでした。"); }
        document.getElementById('status').innerText = "SCAN COMPLETE";
    }

    function togglePlayer(id, vid) {
        const p = document.getElementById(`player-${id}`);
        const url = document.getElementById(`url-${id}`).value;
        const videoId = url.includes('v=') ? url.split('v=')[1].split('&')[0] : vid;
        if(p.style.display==='block') { p.style.display='none'; p.src=''; }
        else { p.style.display='block'; p.src=`https://www.youtube.com/embed/${videoId}?autoplay=1`; }
    }

    async function fetchExtra(id, title, uploader) {
        const res = await fetch('/get_extra_info', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, uploader})
        });
        const data = await res.json();
        document.getElementById(`album-${id}`).value = data.album;
        document.getElementById(`artist-${id}`).value = data.artist;
    }

    async function startBatchDownload() {
        const template = document.getElementById('namingTemplate').value;
        const status = document.getElementById('status');
        for (let i=0; i<songQueue.length; i++) {
            const s = songQueue[i];
            const title = document.getElementById(`title-${s.id}`).value;
            const artist = document.getElementById(`artist-${s.id}`).value;
            const album = document.getElementById(`album-${s.id}`).value;
            const url = document.getElementById(`url-${s.id}`).value;
            let name = template.replace(/{title}/g, title).replace(/{artist}/g, artist).replace(/{album}/g, album).replace(/{n}/g, i+1).replace(/[\\/:*?"<>|]/g, "");
            
            status.innerText = `DOWNLOADING (${i+1}/${songQueue.length}): ${name}`;
            const res = await fetch('/download', { 
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({
                    url: url, filename: name, format: document.getElementById(`format-${s.id}`).value,
                    auto_clean: document.getElementById(`clean-${s.id}`).checked,
                    offset_start: document.getElementById(`off-s-${s.id}`).value,
                    offset_end: document.getElementById(`off-e-${s.id}`).value
                })
            });
            const blob = await res.blob();
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}.${document.getElementById(`format-${s.id}`).value}`; a.click();
            document.getElementById(`card-${s.id}`).style.opacity = "0.5";
        }
        status.innerText = "✨ ALL TASKS COMPLETED";
    }
</script>
</body>
</html>
