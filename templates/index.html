<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBESYNC CONSOLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;900&family=Roboto+Mono:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --fg: #fff; --accent: #00f2ea; --dim: #333; }
        * { box-sizing: border-box; border-radius: 0 !important; font-family: 'Roboto Mono', 'Noto Sans JP', sans-serif; }
        body { background: var(--bg); color: var(--fg); margin: 0; overflow-x: hidden; display: flex; }

        /* --- 隠しサイドバー（システム情報） --- */
        #sidebar {
            position: fixed; left: -260px; top: 0; width: 260px; height: 100vh;
            background: #080808; border-right: 1px solid var(--dim);
            transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1); z-index: 2000; padding: 50px 30px;
        }
        #sidebar.open { left: 0; }
        .sidebar-trigger {
            position: fixed; left: 0; top: 0; width: 30px; height: 100vh;
            background: transparent; cursor: pointer; z-index: 2001; display: flex; align-items: center; justify-content: center;
        }
        .sidebar-trigger span { transform: rotate(-90deg); color: var(--dim); font-size: 0.6rem; letter-spacing: 5px; white-space: nowrap; }
        .sys-group { margin-bottom: 30px; }
        .sys-label { font-size: 0.6rem; color: #666; display: block; margin-bottom: 5px; }
        .sys-val { color: var(--accent); font-weight: bold; font-size: 0.9rem; }

        /* --- メインパネル --- */
        #panel { flex: 1; margin-left: 30px; padding: 60px 50px; min-height: 100vh; }
        header { border-bottom: 3px solid var(--fg); margin-bottom: 60px; display: flex; align-items: baseline; justify-content: space-between; }
        header h1 { font-size: 3.5rem; font-weight: 900; margin: 0; letter-spacing: -3px; }

        .form-block { border: 1px solid var(--dim); padding: 40px; margin-bottom: 50px; background: #050505; }
        .input-row { display: flex; margin-bottom: 10px; }
        input, select { background: #000; border: 1px solid var(--dim); color: #fff; padding: 15px; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--fg); }
        .btn { background: var(--fg); color: var(--bg); border: none; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--accent); color: #000; }

        .btn-plus { width: 60px; font-size: 1.5rem; }
        .scan-cmd { width: 100%; height: 60px; margin-top: 20px; font-size: 1.2rem; border: 1px solid var(--fg); }

        /* --- 楽曲カード --- */
        .track-card { border: 1px solid var(--dim); display: grid; grid-template-columns: 280px 1fr; margin-bottom: 30px; background: #050505; }
        .track-thumb { width: 280px; height: 157px; position: relative; border-right: 1px solid var(--dim); }
        .track-thumb img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
        .track-card:hover img { filter: grayscale(0); }
        .play-btn { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; opacity:0; cursor:pointer; }
        .track-thumb:hover .play-btn { opacity:1; }

        .track-info { padding: 25px; }
        .tag-btn { font-size: 0.6rem; border: 1px solid var(--accent); color: var(--accent); padding: 2px 10px; display: inline-block; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .lbl { font-size: 0.6rem; color: #666; margin-bottom: 5px; display: block; }
        .track-title { width: 100%; border-bottom: 1px solid var(--dim) !important; font-size: 1.2rem; font-weight: 900; margin-bottom: 15px; }

        /* --- 実行ボタン --- */
        #footer-bar {
            position: fixed; bottom: 0; left: 30px; right: 0; height: 80px;
            background: var(--fg); color: var(--bg); display: none; align-items: center;
            justify-content: center; font-weight: 900; font-size: 1.5rem; letter-spacing: 15px; cursor: pointer; z-index: 1000;
        }
        #footer-bar:hover { background: var(--accent); }

        #msg { color: var(--accent); font-size: 0.7rem; margin-bottom: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="sidebar-trigger" onclick="toggleSid()"><span>SYSTEM_MONITOR</span></div>
<div id="sidebar">
    <div class="sys-group"><span class="sys-label">SERVER_STATE</span><span class="sys-val">ONLINE</span></div>
    <div class="sys-group"><span class="sys-label">FREE_TIER</span><span class="sys-val">750h / MONTH</span></div>
    <div class="sys-group"><span class="sys-label">MEMORY</span><span class="sys-val">512MB RAM</span></div>
    <div class="sys-group"><span class="sys-label">AUDIO_ENGINE</span><span class="sys-val">24BIT WAV</span></div>
    <div class="sys-group"><span class="sys-label">TOTAL_TRACKS</span><span class="sys-val" id="cnt">00</span></div>
    <button class="btn" style="width:100%; padding:10px; font-size:0.7rem;" onclick="toggleSid()">閉じる</button>
</div>

<div id="panel">
    <header>
        <h1>VIBESYNC</h1>
        <div style="font-size:0.7rem; color:#444;">V6.5_SOLID_STATE</div>
    </header>

    <div class="form-block">
        <div id="inputs">
            <div class="input-row">
                <input type="text" class="url-in" placeholder="YouTube URL 入力" style="flex:1;">
                <button class="btn btn-plus" onclick="addIn()">+</button>
            </div>
        </div>
        <div style="margin-top:30px;">
            <span class="lbl">ファイル命名規則</span>
            <input type="text" id="tpl" value="[{title}] {artist}" style="width:100%;">
        </div>
        <button class="btn scan-cmd" onclick="doScan()">解析実行</button>
    </div>

    <div id="msg">_待機中</div>
    <div id="list"></div>
</div>

<div id="footer-bar" onclick="doDl()">一括出力</div>

<script>
    function toggleSid() { document.getElementById('sidebar').classList.toggle('open'); }
    function addIn() {
        const d = document.createElement('div'); d.className = 'input-row';
        d.innerHTML = `<input type="text" class="url-in" placeholder="YouTube URL 入力" style="flex:1;"><button class="btn btn-plus" style="background:#222;color:#fff;" onclick="this.parentElement.remove()">-</button>`;
        document.getElementById('inputs').appendChild(d);
    }

    async function doScan() {
        const urls = Array.from(document.querySelectorAll('.url-in')).map(i => i.value).filter(v => v.trim());
        const msg = document.getElementById('msg');
        msg.innerText = "_解析中...";
        
        try {
            const r = await fetch('/analyze', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({urls})
            });
            const d = await r.json();
            
            if (!d.success) { msg.innerText = "_エラー: " + d.error; return; }
            
            const list = document.getElementById('list');
            list.innerHTML = "";
            window.songs = d.songs; // データを保存
            
            d.songs.forEach((s, idx) => {
                const id = "track_" + idx;
                const h = `
                    <div class="track-card" id="card_${idx}">
                        <div class="track-thumb">
                            <img src="${s.thumbnail}">
                            <div class="play-btn" onclick="window.open('${s.url}')">視聴</div>
                        </div>
                        <div class="track-info">
                            <span class="lbl">タイトル</span>
                            <input type="text" id="t_${idx}" class="track-title" value="${s.title}">
                            <div class="row">
                                <div><span class="lbl">歌手</span><input type="text" id="a_${idx}" value="${s.uploader}" style="width:100%;"></div>
                                <div><span class="lbl">開始オフセット(秒)</span><input type="number" id="s_${idx}" value="0" style="width:100%;"></div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #111; padding-top:15px;">
                                <label style="font-size:0.6rem;"><input type="checkbox" id="c_${idx}" checked> 自動カット</label>
                                <select id="f_${idx}"><option value="wav">WAV 24bit</option><option value="mp4">MP4</option></select>
                            </div>
                        </div>
                    </div>`;
                list.insertAdjacentHTML('beforeend', h);
            });
            document.getElementById('footer-bar').style.display = 'flex';
            document.getElementById('cnt').innerText = d.songs.length.toString().padStart(2, '0');
            msg.innerText = "_解析完了";
        } catch(e) { msg.innerText = "_通信エラー"; }
    }

    async function doDl() {
        const tpl = document.getElementById('tpl').value;
        const msg = document.getElementById('msg');
        for(let i=0; i<window.songs.length; i++) {
            const s = window.songs[i];
            const title = document.getElementById(`t_${i}`).value;
            const artist = document.getElementById(`a_${i}`).value;
            let name = tpl.replace('{title}', title).replace('{artist}', artist).replace(/[\\/:*?"<>|]/g, "");
            
            msg.innerText = `_出力中 [${i+1}/${window.songs.length}]: ${name}`;
            const res = await fetch('/download', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    url: s.url, filename: name, format: document.getElementById(`f_${i}`).value,
                    auto_clean: document.getElementById(`c_${i}`).checked,
                    offset_start: document.getElementById(`s_${i}`).value,
                    offset_end: 0
                })
            });
            const blob = await res.blob();
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${name}.${document.getElementById(`f_${i}`).value}`; a.click();
            document.getElementById(`card_${i}`).style.opacity = "0.2";
        }
        msg.innerText = "_全タスク完了";
    }
</script>
</body>
</html>
