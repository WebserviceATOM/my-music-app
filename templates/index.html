<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBESYNC</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --panel: #111; --border: #222; --accent: #00f2ea; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

        /* --- サイドバー（情報集約） --- */
        #side {
            position: fixed; left: -260px; top: 0; width: 260px; height: 100vh;
            background: #080808; border-right: 1px solid var(--border);
            transition: 0.3s ease; z-index: 2000; padding: 60px 25px;
        }
        #side.open { left: 0; }
        .side-trigger {
            position: fixed; left: 10px; top: 15px; width: 45px; height: 45px;
            z-index: 2001; display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .side-trigger div { width: 20px; height: 2px; background: #333; position: relative; }
        .side-trigger div::before, .side-trigger div::after { content: ''; position: absolute; width: 20px; height: 2px; background: #333; left: 0; }
        .side-trigger div::before { top: -7px; } .side-trigger div::after { top: 7px; }

        .sys-item { margin-bottom: 25px; }
        .sys-label { font-size: 0.6rem; color: #444; display: block; border-bottom: 1px solid #111; }
        .sys-val { color: var(--accent); font-weight: bold; font-size: 0.85rem; margin-top: 5px; display: block; }

        /* --- メインパネル --- */
        #main { flex: 1; padding: 60px 20px 140px 20px; width: 100%; max-width: 650px; margin: 0 auto; }
        header { margin-bottom: 40px; text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        header h1 { font-size: 1.2rem; font-weight: 900; letter-spacing: 10px; color: #fff; opacity: 0.6; }

        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        input, select { background: #000; border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
        input:focus { border-color: #444; }
        
        .btn { border: none; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .btn-plus { background: #1a1a1a; color: #fff; width: 50px; font-size: 1.2rem; }
        .btn-run { background: #eee; color: #000; width: 100%; height: 55px; font-size: 0.9rem; margin-top: 10px; }

        /* --- リスト --- */
        .track { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
        .track-top { display: flex; align-items: center; border-bottom: 1px solid #1a1a1a; padding-right: 15px; }
        .thumb { width: 110px; height: 62px; object-fit: cover; border-right: 1px solid var(--border); cursor: pointer; opacity: 0.7; }
        .track-title { flex: 1; background: transparent; border: none; font-size: 0.95rem; font-weight: bold; color: #fff; padding: 15px; outline: none; }
        
        .track-details { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .label { font-size: 0.6rem; color: #555; display: block; margin-bottom: 4px; font-weight: bold; }

        /* --- 実行バー --- */
        #exec-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 610px; height: 65px;
            background: #eee; color: #000; display: none; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.95rem; border-radius: 12px; cursor: pointer; z-index: 1000; letter-spacing: 8px;
        }

        #msg { text-align: center; color: var(--accent); font-size: 0.7rem; margin-bottom: 20px; font-weight: bold; min-height: 1rem; }
    </style>
</head>
<body>

<div class="side-trigger" onclick="toggleSide()"><div></div></div>
<div id="side">
    <div class="sys-item"><span class="sys-label">SERVER</span><span class="sys-val">ONLINE</span></div>
    <div class="sys-item"><span class="sys-label">ENGINE</span><span class="sys-val">24bit WAV</span></div>
    <div class="sys-item"><span class="sys-label">QUOTA</span><span class="sys-val">750h / MONTH</span></div>
    <div class="sys-item"><span class="sys-label">SESSION</span><span class="sys-val" id="cnt">0 曲</span></div>
    <button class="btn" style="width:100%; padding:10px; margin-top:60px; background:#111; color:#444;" onclick="toggleSide()">閉じる</button>
</div>

<div id="main">
    <header><h1>VIBESYNC</h1></header>

    <div class="card">
        <div id="url-inputs">
            <div class="row">
                <input type="text" class="url-in" placeholder="YouTube URL を追加">
                <button class="btn btn-plus" onclick="addIn()">+</button>
            </div>
        </div>
        <div style="margin-top:25px;">
            <span class="label">ファイル名形式</span>
            <input type="text" id="tpl" value="[{title}] {artist}">
        </div>
        <button class="btn btn-run" onclick="doAnalyze()">解析を実行</button>
    </div>

    <div id="msg"></div>
    <div id="list"></div>
</div>

<div id="exec-bar" onclick="doDownload()">一括保存を開始する</div>

<script>
    function toggleSide() { document.getElementById('side').classList.toggle('open'); }
    function addIn() {
        const d = document.createElement('div'); d.className = 'row';
        d.innerHTML = `<input type="text" class="url-in" placeholder="URLを追加"><button class="btn btn-plus" style="background:#000;" onclick="this.parentElement.remove()">-</button>`;
        document.getElementById('url-inputs').appendChild(d);
    }

    async function doAnalyze() {
        const urls = Array.from(document.querySelectorAll('.url-in')).map(i => i.value).filter(v => v.trim());
        const msg = document.getElementById('msg');
        msg.innerText = "解析中...";
        
        try {
            const r = await fetch('/analyze', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({urls}) });
            const d = await r.json();
            if (!d.success) { msg.style.color = "#ff4b4b"; msg.innerText = "ERROR: " + d.error; return; }
            
            const list = document.getElementById('list');
            list.innerHTML = ""; window.songs = d.songs;
            
            d.songs.forEach((s, i) => {
                const html = `
                    <div class="track" id="card_${i}">
                        <div class="track-top">
                            <img class="thumb" src="${s.thumbnail}" onclick="window.open('${s.url}')">
                            <input type="text" id="t_${i}" class="track-title" value="${s.title}">
                        </div>
                        <div class="track-details">
                            <div><span class="label">歌手名</span><input type="text" id="a_${i}" value="${s.uploader}"></div>
                            <div><span class="label">形式</span><select id="f_${i}"><option value="wav">WAV</option><option value="mp4">MP4</option></select></div>
                            <div><span class="label">開始カット(秒)</span><input type="number" id="s_${i}" value="0"></div>
                            <div><span class="label">終了カット(秒)</span><input type="number" id="e_${i}" value="0"></div>
                        </div>
                    </div>`;
                list.insertAdjacentHTML('beforeend', html);
            });
            document.getElementById('exec-bar').style.display = 'flex';
            document.getElementById('cnt').innerText = d.songs.length + " 曲";
            msg.innerText = "";
        } catch(e) { msg.innerText = "通信エラー"; }
    }

    async function doDownload() {
        const tpl = document.getElementById('tpl').value;
        const msg = document.getElementById('msg');
        for(let i=0; i<window.songs.length; i++) {
            const s = window.songs[i];
            const title = document.getElementById(`t_${i}`).value;
            const artist = document.getElementById(`a_${i}`).value;
            let name = tpl.replace('{title}', title).replace('{artist}', artist).replace(/[\\/:*?"<>|]/g, "");
            msg.innerText = `[${i+1}/${window.songs.length}] 保存中...`;
            const res = await fetch('/download', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    url: s.url, filename: name, format: document.getElementById(`f_${i}`).value,
                    offset_start: document.getElementById(`s_${i}`).value, offset_end: document.getElementById(`e_${i}`).value
                })
            });
            const b = await res.blob();
            const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `${name}.${document.getElementById(`f_${i}`).value}`; a.click();
            document.getElementById(`card_${i}`).style.opacity = "0.2";
        }
        msg.innerText = "完了";
    }
</script>
</body>
</html>
